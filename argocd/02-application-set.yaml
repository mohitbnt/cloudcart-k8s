apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cloudcart-appset
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  generators:
    - list:
        elements:
          - env: prod
            cluster: https://kubernetes.default.svc
            revision: v1.1.3
            slackChannel: argoprod-cloudcart
          - env: dev
            cluster: https://kubernetes.default.svc
            revision: HEAD
            slackChannel: argodev-cloudcart
  template:
    metadata:
      name: cloudcart-{{env}}
      annotations:
        notifications.argoproj.io/subscribe.on-created.slack: "{{slackChannel}}"
        notifications.argoproj.io/subscribe.on-deleted.slack: "{{slackChannel}}"
        notifications.argoproj.io/subscribe.on-sync-succeeded.slack: "{{slackChannel}}"
        notifications.argoproj.io/subscribe.on-sync-failed.slack: "{{slackChannel}}"
        notifications.argoproj.io/subscribe.on-health-degraded.slack: "{{slackChannel}}"
    spec:
      project: cloudcart-{{env}}
      source:
        repoURL: https://github.com/mohitbnt/cloudcart-k8s.git
        targetRevision: '{{revision}}'
        path: kubernetes/overlays/{{env}}
      destination:
        server: '{{cluster}}'
        namespace: cloudcart-{{env}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
