apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudcart-root-bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mohitbnt/cloudcart-k8s.git
    targetRevision: main
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
