apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudcart-inventory-hpa
  labels:
    app.kubernetes.io/name: inventory-hpa
    app.kubernetes.io/instance: cloudcart-inventory-hpa
    app.kubernetes.io/component: autoscaler
    app.kubernetes.io/part-of: cloudcart
    app.kubernetes.io/managed-by: kustomize
  namespace: cloudcart
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudcart-inventory-deployment
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80