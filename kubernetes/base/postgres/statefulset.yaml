apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloudcart-postgresql-statefulset
  labels:
    app.kubernetes.io/name: postgres-statefulset
    app.kubernetes.io/instance: cloudcart-postgresql-statefulset
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cloudcart
    app.kubernetes.io/managed-by: kustomize
  namespace: cloudcart
spec:
  serviceName: cloudcart-postgresql-service
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: cloudcart-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: cloudcart-postgresql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: cloudcart
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
        - name: cloudcart-postgresql-container
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: cloudcart-secret
          volumeMounts:
            - name: cloudcart-postgresql-volume
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: cloudcart-postgresql-volume
      spec:
        storageClassName: local-storage-custom
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi