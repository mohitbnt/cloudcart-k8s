apiVersion: v1
kind: Service
metadata:
  name: cloudcart-notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/instance: cloudcart-notification-service
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: cloudcart
    app.kubernetes.io/managed-by: kustomize
  namespace: cloudcart
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: notification
    app.kubernetes.io/instance: cloudcart-notification