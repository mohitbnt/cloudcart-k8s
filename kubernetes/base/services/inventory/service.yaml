apiVersion: v1
kind: Service
metadata:
  name: cloudcart-inventory-service
  labels:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/instance: cloudcart-inventory-service
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: cloudcart
    app.kubernetes.io/managed-by: kustomize
  namespace: cloudcart
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: inventory
    app.kubernetes.io/instance: cloudcart-inventory