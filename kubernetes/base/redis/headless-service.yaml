apiVersion: v1
kind: Service
metadata:
  name: cloudcart-redis-service
  labels:
    app.kubernetes.io/name: redis-service
    app.kubernetes.io/instance: cloudcart-redis-service
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: cloudcart
    app.kubernetes.io/managed-by: kustomize
  namespace: cloudcart
spec:
  clusterIP: None
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: cloudcart-redis