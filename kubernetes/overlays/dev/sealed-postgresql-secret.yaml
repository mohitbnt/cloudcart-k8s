---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
  name: cloudcart-secret
  namespace: cloudcart-dev
spec:
  encryptedData:
    DATABASE_URL: 
    POSTGRES_DB: 
    POSTGRES_HOST: 
    POSTGRES_PASSWORD: 
    POSTGRES_PORT: 
    POSTGRES_USER: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/namespace-wide: "true"
      labels:
        app.kubernetes.io/component: secret
        app.kubernetes.io/instance: cloudcart-secret
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: cloudcart
        app.kubernetes.io/part-of: cloudcart
      name: cloudcart-secret
      namespace: cloudcart-dev
    type: Opaque
