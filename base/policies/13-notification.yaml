apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notification-netpol
  labels:
    app.kubernetes.io/name: notification-netpol
    app.kubernetes.io/instance: cloudcart-notification-netpol
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: cloudcart
    app.kubernetes.io/managed-by: kubectl
  namespace: cloudcart
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notification
      app.kubernetes.io/instance: cloudcart-notification
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: cloudcart-postgresql
      ports:
        - protocol: TCP
          port: 5432