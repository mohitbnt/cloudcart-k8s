apiVersion: v1
kind: Service
metadata:
  name: cloudcart-catalog-service
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/instance: cloudcart-catalog-service
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: cloudcart
    app.kubernetes.io/managed-by: kubectl
  namespace: cloudcart
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/instance: cloudcart-catalog