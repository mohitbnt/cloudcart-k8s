apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcart-inventory-deployment
  labels:
    app.kubernetes.io/name: inventory-deployment
    app.kubernetes.io/instance: cloudcart-inventory-deployment
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: cloudcart
    app.kubernetes.io/managed-by: kubectl
  namespace: cloudcart
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory
      app.kubernetes.io/instance: cloudcart-inventory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory
        app.kubernetes.io/instance: cloudcart-inventory
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: cloudcart
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
        - name: cloudcart-inventory-container
          image: public.ecr.aws/k3e1b3j2/cloudcart/inventory:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloudcart-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3