apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcart-order-deployment
  labels:
    app.kubernetes.io/name: order-deployment
    app.kubernetes.io/instance: cloudcart-order-deployment
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: cloudcart
    app.kubernetes.io/managed-by: kustomize
  namespace: cloudcart
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order
      app.kubernetes.io/instance: cloudcart-order
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order
        app.kubernetes.io/instance: cloudcart-order
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: cloudcart
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
        - name: cloudcart-order-container
          image: public.ecr.aws/k3e1b3j2/cloudcart/order:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloudcart-secret
                  key: DATABASE_URL
            - name: INVENTORY_URL
              valueFrom:
                configMapKeyRef:
                  key: INVENTORY_URL
                  name: cloudcart-configmap
            - name: PAYMENT_URL
              valueFrom:
                configMapKeyRef:
                  key: PAYMENT_URL
                  name: cloudcart-configmap
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3