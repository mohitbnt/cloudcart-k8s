services:

  postgres:
    image: postgres:17-alpine
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog:
    build:
      context: ./services/catalog
    env_file:
      - .env
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  identity:
    build:
      context: ./services/identity
    env_file:
      - .env
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  inventory:
    build:
      context: ./services/inventory
    env_file:
      - .env
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  payment:
    build:
      context: ./services/payment
    env_file:
      - .env
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  order:
    build:
      context: ./services/order
    env_file:
      - .env
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      inventory:
        condition: service_started
      payment:
        condition: service_started

  cart:
    build:
      context: ./services/cart
    env_file:
      - .env
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  notification:
    build:
      context: ./services/notification
    env_file:
      - .env
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: ./gateway
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - edge
      - internal
    restart: unless-stopped
    depends_on:
      - catalog
      - identity
      - cart
      - order

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    networks:
      - edge
    restart: unless-stopped
    depends_on:
      - gateway

networks:
  edge:
  internal:
    internal: true

volumes:
  postgres-data:
  redis-data: