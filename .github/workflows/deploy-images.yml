            git push
          fi

          # Payment Image Build and Push
          if [[ "${{ steps.filter.outputs.payment }}" == "true" ]]; then
            echo "Payment changed! Building and pushing image..."
            docker compose -f docker-compose.yaml build payment
            docker compose -f docker-compose.yaml push payment

            echo "Updating newTag in kustomization.yml..."
            cd kubernetes/overlays/dev
