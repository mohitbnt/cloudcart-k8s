name: Build and Push images to GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloudcart-application/frontend/**'
      - 'cloudcart-application/gateway/**'
      - 'cloudcart-application/services/cart/**'
      - 'cloudcart-application/services/catalog/**'
      - 'cloudcart-application/services/identity/**'
      - 'cloudcart-application/services/inventory/**'
      - 'cloudcart-application/services/notification/**'
      - 'cloudcart-application/services/order/**'
      - 'cloudcart-application/services/payment/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  detect-changes-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check for the file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'cloudcart-application/frontend/**'
            gateway:
              - 'cloudcart-application/gateway/**'
            cart:
              - 'cloudcart-application/services/cart/**'
            catalog:
              - 'cloudcart-application/services/catalog/**'
            identity:
              - 'cloudcart-application/services/identity/**'
            inventory:
              - 'cloudcart-application/services/inventory/**'
            notification:
              - 'cloudcart-application/services/notification/**'
            order:
              - 'cloudcart-application/services/order/**'
            payment:
              - 'cloudcart-application/services/payment/**'

      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.8.1"
      
      - name: Build and push Docker image and update newTag in kustomization.yaml
        run: |
          cp cloudcart-application/.env.example cloudcart-application/.env
          export TAG=${{ github.sha }}
          export REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          # Frontend Image Build and Push
          if [[ "${{ steps.filter.outputs.frontend }}" == "true" ]]; then
            echo "Frontend changed! Building and pushing image..."
            docker compose -f docker-compose.yaml build frontend
            docker compose -f docker-compose.yaml push frontend

            echo "Updating newTag in kustomization.yml..."
            cd kubernetes/overlays/dev
            kustomize edit set image ghcr.io/${REPO_OWNER}/cloudcart-frontend=${TAG}

            echo "Committing updated manifest back to Git..."
            cd ../../../
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@github.com"
            git add kubernetes/overlays/dev/kustomization.yaml
            git commit -m "chore(gitops): update dev frontend image tag to ${TAG} [skip ci]"
            git push
          fi

          # Gateway Image Build and Push
          if [[ "${{ steps.filter.outputs.gateway }}" == "true" ]]; then
            echo "Gateway changed! Building and pushing image..."
            docker compose -f docker-compose.yaml build gateway
            docker compose -f docker-compose.yaml push gateway

            echo "Updating newTag in kustomization.yml..."
            cd kubernetes/overlays/dev
            kustomize edit set image ghcr.io/${REPO_OWNER}/cloudcart-gateway=${TAG}

            echo "Committing updated manifest back to Git..."
            cd ../../../
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@github.com"
            git add kubernetes/overlays/dev/kustomization.yaml
            git commit -m "chore(gitops): update dev gateway image tag to ${TAG} [skip ci]"
            git push
          fi

          # Cart Image Build and Push
          if [[ "${{ steps.filter.outputs.cart }}" == "true" ]]; then
            echo "Cart changed! Building and pushing image..."
            docker compose -f docker-compose.yaml build cart
            docker compose -f docker-compose.yaml push cart

            echo "Updating newTag in kustomization.yml..."
            cd kubernetes/overlays/dev
