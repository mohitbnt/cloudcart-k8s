            git commit -m "chore(gitops): update dev identity image tag to ${TAG} [skip ci]"
            git push
          fi

          # Inventory Image Build and Push
          if [[ "${{ steps.filter.outputs.inventory }}" == "true" ]]; then
            echo "Inventory changed! Building and pushing image..."
            docker compose -f docker-compose.yaml build inventory
            docker compose -f docker-compose.yaml push inventory

            echo "Updating newTag in kustomization.yml..."
            cd kubernetes/overlays/dev
