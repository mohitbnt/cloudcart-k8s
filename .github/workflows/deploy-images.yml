            git config --global user.email "github-actions[bot]@github.com"
            git add kubernetes/overlays/dev/kustomization.yaml
            git commit -m "chore(gitops): update dev inventory image tag to ${TAG} [skip ci]"
            git push
          fi

          # Notification Image Build and Push
          if [[ "${{ steps.filter.outputs.notification }}" == "true" ]]; then
            echo "Notification changed! Building and pushing image..."
            docker compose -f docker-compose.yaml build notification
            docker compose -f docker-compose.yaml push notification

            echo "Updating newTag in kustomization.yml..."
            cd kubernetes/overlays/dev
            kustomize edit set image ghcr.io/${REPO_OWNER}/cloudcart-notification=${TAG}

            echo "Committing updated manifest back to Git..."
            cd ../../../
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@github.com"
            git add kubernetes/overlays/dev/kustomization.yaml
            git commit -m "chore(gitops): update dev notification image tag to ${TAG} [skip ci]"
            git push
          fi

          # Order Image Build and Push
          if [[ "${{ steps.filter.outputs.order }}" == "true" ]]; then
            echo "Order changed! Building and pushing image..."
            docker compose -f docker-compose.yaml build order
            docker compose -f docker-compose.yaml push order

