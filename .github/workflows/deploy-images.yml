            git commit -m "chore(gitops): update dev cart image tag to ${TAG} [skip ci]"
            git push
          fi

          # Catalog Image Build and Push
          if [[ "${{ steps.filter.outputs.catalog }}" == "true" ]]; then
            echo "Catalog changed! Building and pushing image..."
