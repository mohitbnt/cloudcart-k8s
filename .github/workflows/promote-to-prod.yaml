name: Prepare Production Promotion via PR

on:
  pull_request:
    branches:
      - main
    paths:
      - 'kubernetes/overlays/dev/kustomization.yaml'

jobs:
  prepare-prod-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Sync Dev Images to Prod Overlay
        run: |
          DEV_KUST="kubernetes/overlays/dev/kustomization.yaml"
          PROD_KUST="kubernetes/overlays/prod/kustomization.yaml"
          
          # Read the images block strictly from dev
          IMAGES_YAML=$(yq eval '.images' $DEV_KUST)
          
          # Inject the images block into the production kustomization file
          export IMAGES_YAML
          yq eval '.images = env(IMAGES_YAML)' -i $PROD_KUST
          echo "Successfully copied image versions from Dev to Prod overlay."

      - name: Ensure ApplicationSet Prod Tracks Main Branch
        run: |
          APPSET_FILE="argocd/02-application-set.yaml"
          
          # Force the prod revision to track main branch for post-merge rollout
          yq eval '(.spec.generators.list.elements | select(.env == "prod")).revision = "main"' -i $APPSET_FILE
          echo "Confirmed ApplicationSet prod revision is set to main."

      - name: Commit Changes to PR Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          git add kubernetes/overlays/prod/kustomization.yaml argocd/02-application-set.yaml
          
          if ! git diff --cached --exit-code; then
            git commit -m "chore(gitops): auto-sync dev image versions to prod overlay [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "Prod overlay is already perfectly in sync with Dev."
          fi
