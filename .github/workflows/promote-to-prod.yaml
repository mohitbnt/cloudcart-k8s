name: Production Release Promotion

on:
  push:
    tags:
      - 'v*'
  release: 
    types: [published]

jobs:
  promote-to-production:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so tag references resolve cleanly

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Sync Dev Images to Prod Overlay
        run: |
          DEV_KUST="kubernetes/overlays/dev/kustomization.yaml"
          PROD_KUST="kubernetes/overlays/prod/kustomization.yaml"
          
          # 1. Get a clean list of all target image identifiers present in dev
          IMAGE_NAMES=$(yq eval '.images[].name' $DEV_KUST)
          
          # 2. Loop through each image name, find its current newTag, and update it inside prod
          echo "$IMAGE_NAMES" | while read -r img_name; do
            if [ -n "$img_name" ]; then
              # Extract the specific newTag active in dev for this exact image matching key
              DEV_TAG=$(yq eval ".images[] | select(.name == \"$img_name\") | .newTag" $DEV_KUST)
              
              # Inject only that specific verified newTag into the production manifest configuration block
              yq eval "(.images[] | select(.name == \"$img_name\")).newTag = \"$DEV_TAG\"" -i $PROD_KUST
            fi
          done
          echo "Successfully promoted targeted image version tags to production cleanly."

      - name: Update ApplicationSet Production Target Revision
        run: |
          APPSET_FILE="argocd/02-application-set.yaml"
          RELEASE_VERSION="${{ github.ref_name }}"
          
          # Dynamically point the prod cluster generator to look at this new tag snapshot
          yq eval '(.spec.generators[0].list.elements | select(.env == "prod")).revision = "'"$RELEASE_VERSION"'"' -i $APPSET_FILE
          echo "Updated ApplicationSet prod target version to $RELEASE_VERSION"

      - name: Safe Push Back to Main and Move Tag Forward
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          RELEASE_VERSION="${{ github.ref_name }}"
          git add kubernetes/overlays/prod/kustomization.yaml argocd/02-application-set.yaml
          
          if ! git diff --cached --exit-code; then
            git commit -m "chore(release): lock production manifests for version $RELEASE_VERSION [skip ci]"
            
            # 1. Update the primary main branch with the locked production manifests
            git push origin HEAD:main
            
            # 2. Re-point the release tag locally to include these manifest updates
            git tag -d "$RELEASE_VERSION"
            git tag "$RELEASE_VERSION"
            
            # 3. Force push the tag back up so ArgoCD pulls the final updated files at this tag snapshot
            git push origin "$RELEASE_VERSION" --force
          else
            echo "Production manifests are already up to date with this release version."
          fi
