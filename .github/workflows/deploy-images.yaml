name: Build and Push images to GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloudcart-application/frontend/**'
      - 'cloudcart-application/gateway/**'
      - 'cloudcart-application/services/**'

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check for the file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend: ['cloudcart-application/frontend/**']
            gateway: ['cloudcart-application/gateway/**']
            cart: ['cloudcart-application/services/cart/**']
            catalog: ['cloudcart-application/services/catalog/**']
            identity: ['cloudcart-application/services/identity/**']
            inventory: ['cloudcart-application/services/inventory/**']
            notification: ['cloudcart-application/services/notification/**']
            order: ['cloudcart-application/services/order/**']
            payment: ['cloudcart-application/services/payment/**']

      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.8.1"
      
      - name: Execute Conditional Builds and Update Local Manifests
        run: |
          # 1. Create the .env file where docker-compose expects it
          cp cloudcart-application/.env.example cloudcart-application/.env
          
          # 2. Export variables to the runner shell environment
          export TAG=${{ github.sha }}
          export REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          SERVICES_UPDATED=()
          
          # Function to build, push, and stage Kustomize modifications safely
          build_service() {
            local service_id=$1
            local image_name=$2
            
            echo "==== Building and pushing ${service_id} ===="
            
            # Use explicit project flags so docker compose reads the .env file perfectly
            docker compose \
              --file cloudcart-application/docker-compose.yaml \
              --project-directory cloudcart-application \
              build ${service_id}
              
            docker compose \
              --file cloudcart-application/docker-compose.yaml \
              --project-directory cloudcart-application \
              push ${service_id}
            
            echo "Updating local dev kustomization tag..."
            pushd kubernetes/overlays/dev > /dev/null
            kustomize edit set image ghcr.io/${REPO_OWNER}/${image_name}=${TAG}
            popd > /dev/null
            
            SERVICES_UPDATED+=("${service_id}")
          }

          # Process all changes sequentially out of the root directory
          if [[ "${{ steps.filter.outputs.frontend }}" == "true" ]]; then build_service "frontend" "cloudcart-frontend"; fi
          if [[ "${{ steps.filter.outputs.gateway }}" == "true" ]]; then build_service "gateway" "cloudcart-gateway"; fi
          if [[ "${{ steps.filter.outputs.cart }}" == "true" ]]; then build_service "cart" "cloudcart-cart"; fi
          if [[ "${{ steps.filter.outputs.catalog }}" == "true" ]]; then build_service "catalog" "cloudcart-catalog"; fi
          if [[ "${{ steps.filter.outputs.identity }}" == "true" ]]; then build_service "identity" "cloudcart-identity"; fi
          if [[ "${{ steps.filter.outputs.inventory }}" == "true" ]]; then build_service "inventory" "cloudcart-inventory"; fi
          if [[ "${{ steps.filter.outputs.notification }}" == "true" ]]; then build_service "notification" "cloudcart-notification"; fi
          if [[ "${{ steps.filter.outputs.order }}" == "true" ]]; then build_service "order" "cloudcart-order"; fi
          if [[ "${{ steps.filter.outputs.payment }}" == "true" ]]; then build_service "payment" "cloudcart-payment"; fi

          echo "UPDATED_LIST=${SERVICES_UPDATED[*]}" >> $GITHUB_ENV


      - name: Atomic Git Commit and Push
        run: |
          if [[ -n "${{ env.UPDATED_LIST }}" ]]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@://github.com"
            
            git add kubernetes/overlays/dev/kustomization.yaml
            
            # Checks if changes were actually written to prevent empty commit errors
            if ! git diff --cached --exit-code; then
              git commit -m "chore(gitops): auto-deploy [${{ env.UPDATED_LIST }}] to dev at tag ${{ github.sha }} [skip ci]"
              git push origin HEAD:main
            fi
          else
            echo "No changes detected across services. Skipping manifest updates."
          fi